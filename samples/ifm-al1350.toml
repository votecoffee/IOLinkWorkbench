version = 1
name = "AL1350 bench template"
# Set the actual input width before capturing. Add an IODD layout or manual fields.
input_bytes = 2

[connection]
gateway = "ifm_al1350"
port = 1
endpoint = ""
poll_us = 20000
timeout_ms = 1000
reconnect_ms = 500
