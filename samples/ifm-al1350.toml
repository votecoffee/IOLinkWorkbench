[expected_identity]
# vendor_id = <connected sensor vendor ID>
# device_id = <connected sensor device ID>
# product_id = "<selected IODD Product ID>"

[logging]
mode = "every_update"
queue_capacity = 8192
rotate_rows = 0
rotate_seconds = 0
