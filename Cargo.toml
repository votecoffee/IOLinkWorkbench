[package]
name = "iolink-workbench"
version = "0.15.0"
edition = "2024"
description = "Read-only IO-Link input inspection and capture workbench"
license = "MIT"
repository = "https://github.com/votecoffee/IOLinkWorkbench"
default-run = "iolink-workbench"

[features]
default = ["desktop"]
desktop = ["dep:eframe"]

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4.5", features = ["derive"] }
crossbeam-queue = "0.3"
csv = "1"
ctrlc = "3"
eframe = { version = "0.31.1", optional = true, default-features = false, features = ["glow", "default_fonts"] }
hdrhistogram = { version = "7", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "native-tls"] }
roxmltree = "0.20"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10.9"
tempfile = "3"
toml = "0.8"
zip = { version = "4", default-features = false, features = ["deflate"] }

[[bin]]
name = "iolink-workbench"
path = "src/main.rs"
required-features = ["desktop"]

[[bin]]
name = "iolink-cli"
path = "src/bin/iolink-cli.rs"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Security", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_System_JobObjects"] }

[profile.release]
strip = "symbols"
